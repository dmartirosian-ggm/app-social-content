# Renders clips and pins and publishes them, with the review dashboard, to the public R2 bucket.
# Runs on every branch. A push that only changes apps/<app>/ publishes just that app, so
# branches working on different apps do not overwrite each other. A push that changes the
# shared engine, or a manual run, publishes every app in that branch.
name: Publish social content

on:
  push:
    paths:
      - "apps/**"
      - "engine/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out which apps to publish
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          list="$(.github/scripts/changed-apps.sh "$EVENT" "$BEFORE" "$DEFAULT_BRANCH")"
          echo "Publishing: ${list:-nothing}"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.apps.outputs.list != ''
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg, Cairo and Python packages
        if: steps.apps.outputs.list != ''
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          $APT update -qq
          $APT install -y -qq --no-install-recommends ffmpeg libcairo2
          pip install -q -r requirements.txt
      - name: Install each app's fonts
        if: steps.apps.outputs.list != ''
        run: |
          mkdir -p ~/.fonts
          cp apps/*/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -f
      - name: Render
        if: steps.apps.outputs.list != ''
        env:
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          for app in $APPS; do
            for script in "apps/$app/clip.py" "apps/$app/pin.py"; do
              [ -f "$script" ] || continue
              echo "::group::$script"
              python "$script"
              echo "::endgroup::"
            done
          done
      - name: Build the review dashboard
        if: steps.apps.outputs.list != ''
        run: python -m engine.dashboard
      - name: Upload to R2
        if: steps.apps.outputs.list != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a repository secret named CLOUDFLARE_API_TOKEN (Cloudflare token with Workers R2 Storage: Edit)."
            exit 1
          fi
          python -m engine.upload | tee urls.txt
          {
            echo "### Review dashboard"
            echo
            echo "https://pub-7639d3eca7d54cc4b5733370bb923e14.r2.dev/index.html"
            echo
            echo "### Published files"
            echo
            sed 's/^/- /' urls.txt
          } >> "$GITHUB_STEP_SUMMARY"
